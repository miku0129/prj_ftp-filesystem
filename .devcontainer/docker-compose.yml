services:
   nginx:
     build: ../nginx/
     ports:
       - 80:80
     volumes:
         - ../:/var/www/html/

   php:
     build: ../php/
     volumes:
        - ../:/var/www/html/

   ftp-server: 
      container_name: my-ftp-server
      environment:
        - PUBLIC_IP=192.168.0.1
        - FTP_PASS=123
        - FTP_USER=user
      image: garethflowers/ftp-server
      ports:
        - "20-21:20-21/tcp"
        - "40000-40009:40000-40009/tcp" # For passive mode
      volumes:
        - "proftpd-data:/home/user"
        
volumes:
    proftpd-data: